services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: finrisk
      POSTGRES_USER: finrisk
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-finrisk_dev_only}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finrisk -d finrisk"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ./backend
    environment:
      APP_ENV: ${APP_ENV:-development}
      API_V1_PREFIX: /api/v1
      DATABASE_URL: postgresql+psycopg://finrisk:${POSTGRES_PASSWORD:-finrisk_dev_only}@db:5432/finrisk
      PERSISTENCE_ENABLED: "true"
      CORS_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"]
      interval: 15s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
    environment:
      NODE_ENV: production
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres_data:
